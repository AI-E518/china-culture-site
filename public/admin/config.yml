# Decap CMS 配置（网页后台发文章用）
# 上线前请把 repo 改成你自己的 GitHub 仓库，例如 yourname/china-culture-site
backend:
  name: github
  repo: AI-E518/china-culture-site
  branch: main
  base_url: https://askoldai.com
  site_url: https://askoldai.com
  auth_endpoint: auth

# 媒体文件存放位置（图片上传后自动放到这里）
media_folder: "public/media/uploads"
public_folder: "/media/uploads"

# 编辑界面语言
locale: "zh"

# 同一组字段复用到 8 个栏目（4 语言 × 已发布/草稿），文件仍放同一目录，翻译脚本不动
collections:
  # ===== 中文 · 已发布（主笔在这里写新文章；新文默认即已发布状态） =====
  - name: "posts-zh"
    label: "文章 · 中文 · 已发布"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [pubDate, title, category]
    filter:
      - { field: lang, value: zh }
      - { field: draft, value: false }
    view_groups:
      - { label: "按分类", field: category }
      - { label: "按城市", field: location }
    fields:
      - { name: title, label: "标题", widget: string }
      - { name: lang, label: "语言", widget: hidden, default: "zh" }
      - { name: draft, label: "草稿（勾选=仅后台可见不发布；取消勾选=发布到公开站）", widget: boolean, default: false }
      - { name: category, label: "分类", widget: select, options: [{ label: "非遗 Heritage", value: "heritage" }, { label: "美食 Food", value: "food" }, { label: "旅游 Travel", value: "travel" }], default: "heritage" }
      - { name: summary, label: "摘要", widget: text }
      - { name: cover, label: "封面图", widget: image, required: false }
      - { name: tags, label: "标签", widget: list, field: { name: tag, widget: string } }
      # 地点：值存中文名（与 china.ts 的 c.zh 一致，地图靠它匹配）
      - { name: location, label: "地点（城市）", widget: select, required: false, options: [北京, 天津, 哈尔滨, 沈阳, 济南, 青岛, 南京, 苏州, 上海, 杭州, 厦门, 武汉, 长沙, 成都, 重庆, 西安, 敦煌, 乌鲁木齐, 拉萨, 昆明, 大理, 丽江, 桂林, 广州, 深圳, 香港, 三亚, 台北] }
      - name: faq
        label: "常见问题 FAQ（可选，用于 AI 搜索引用）"
        widget: list
        required: false
        field:
          name: item
          widget: object
          fields:
            - { name: q, label: "问题", widget: string }
            - { name: a, label: "答案", widget: text }
      - { name: pubDate, label: "发布日期", widget: datetime }
      - { name: body, label: "正文", widget: markdown }

  # ===== 中文 · 草稿（机器翻译前/人工存草稿；取消草稿勾选即转入「已发布」栏） =====
  - name: "posts-zh-draft"
    label: "文章 · 中文 · 草稿"
    folder: "src/content/posts"
    create: false
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [pubDate, title, category]
