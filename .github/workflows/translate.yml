name: translate-posts

# 中文文章一提交就自动生成 en/ja/ko 草稿（draft:true），人工审校后发布
on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
  # 允许在 Actions 标签页手动点「Run workflow」触发，不依赖 Decap push
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装翻译脚本依赖（yaml 库，--no-save 避免污染 package.json）
        run: npm install --no-save yaml

      - name: 扫描所有中文文章并生成缺失草稿
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          set -e
          shopt -s nullglob
          files=(src/content/posts/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "posts 目录无文章，跳过"
            exit 0
          fi
          echo "扫描到文章文件："
          printf '  %s\n' "${files[@]}"
          names=""
          for f in "${files[@]}"; do names="$names $(basename "$f")"; done
          # 未加引号：当前文件名均不含空格；脚本内部按 lang=zh 过滤、按目标文件存在性跳过
          node scripts/translate.mjs $names

      - name: 提交生成的草稿（[skip ci] 避免触发自身）
        run: |
          # 关键：先 add，再用 --cached 判断（含未跟踪的新草稿）
          git add src/content/posts/
          if git diff --cached --quiet; then
            echo "无新草稿生成"
            exit 0
          fi
          git config user.name "translate-bot"
          git config user.email "bot@askoldai.com"
          git commit -m "chore: 自动翻译中文文章生成 en/ja/ko 草稿 [skip ci]"
          # 显式推当前 HEAD 到 main；若运行期间用户又在后台发文导致远端领先被拒，
          # 此刻工作区已干净（翻译已 commit、npm --no-save 不留痕），rebase 安全，变基后重推
          git push origin HEAD:main || (git fetch origin main && git rebase origin/main && git push origin HEAD:main)
